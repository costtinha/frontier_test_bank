spring.application.name=bank

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
spring.datasource.username=${DB_USER:bank}
spring.datasource.password=${DB_PASSWORD:bank}

# --- JPA / Hibernate ---
# O schema e criado/versionado pelo Flyway; o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
