spring.application.name=bank

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bank}
spring.datasource.username=${DB_USER:bank}
spring.datasource.password=${DB_PASSWORD:bank}

# --- JPA / Hibernate ---
# O schema e criado/versionado pelo Flyway; o Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Domain events / outbox ---
# transport: logging (dev, sem broker) | kafka (producao)
bank.events.transport=logging
bank.events.topic=bank.events
bank.events.outbox.poll-interval=2000
bank.events.outbox.batch-size=50
# Para Kafka, configure tambem:
#   bank.events.transport=kafka
#   spring.kafka.bootstrap-servers=localhost:9092

# --- Projecoes / read models (CQRS) ---
bank.projection.poll-interval=2000
bank.projection.batch-size=50
# Tentativas antes de o evento ir para a dead letter e deixar de bloquear o stream
bank.projection.max-attempts=5

# --- Observabilidade ---
# Metricas de negocio/infra (bank.*) e health em /actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Toda linha de log carrega o id de correlacao (HTTP -> evento -> projecao)
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n
